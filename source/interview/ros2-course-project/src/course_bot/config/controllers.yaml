controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names: [left_wheel_joint]
    right_wheel_names: [right_wheel_joint]
    wheel_separation: 0.34
    wheel_radius: 0.065
    position_feedback: true
    open_loop: false
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    enable_odom_tf: true
    tf_frame_prefix_enable: false
    cmd_vel_timeout: 0.5
    velocity_rolling_window_size: 10
    pose_covariance_diagonal: [0.01, 0.01, 0.1, 0.1, 0.1, 0.02]
    twist_covariance_diagonal: [0.01, 0.01, 0.1, 0.1, 0.1, 0.02]
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.35
    linear.x.min_velocity: -0.2
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 0.5
    linear.x.min_acceleration: -0.5
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.2
    angular.z.min_velocity: -1.2
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 1.5
    angular.z.min_acceleration: -1.5
